<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161614">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Actividades">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Registro de actividades</title>
<style>
:root{--bg:#161614;--card:#222220;--tx:#efeee9;--mut:#9a988f;--bd:#363632;--ac:#5fb8a0;--red:#e5776a;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 16px}
h2{font-size:16px;margin:28px 0 10px}
.row{display:flex;gap:8px}
textarea{width:100%;min-height:110px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;resize:vertical;margin:8px 0}
input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:10px}
button.p{background:var(--ac);border-color:var(--ac);color:#0e1512;font-weight:600}
button.stop{background:var(--red);border-color:var(--red);color:#1a0b09;font-weight:600}
button.danger{color:var(--red);border-color:var(--red)}
button.g{border:0;background:none;color:var(--mut);padding:4px 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;border-left:6px solid var(--c)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
#list .empty{grid-column:1/-1}
.card button:not(.p):not(.stop){font-size:13px;padding:6px 10px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.name{font-weight:600;word-break:break-word}
.sub{color:var(--mut);font-size:13px}
.live{color:var(--ac);font-weight:600}
details{margin-top:8px}
summary{cursor:pointer;color:var(--mut);font-size:13px}
.ses{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;border-top:1px solid var(--bd);margin-top:4px;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:18px;width:min(360px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog label{display:block;font-size:13px;color:var(--mut);margin-top:12px}
dialog input{width:100%;margin-top:4px}
dialog input[type=checkbox]{width:auto;margin:0 10px 0 0;accent-color:var(--ac)}
select{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
canvas{width:100%;height:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.empty{color:var(--mut);text-align:center;padding:24px 0}
</style>
</head>
<body>
<main>
<div class="top" style="margin-bottom:16px"><h1 style="margin:0">Registro de actividades</h1><button id="newday">Nuevo día</button></div>
<div class="row">
  <input id="nm" placeholder="Nueva actividad (ej: Video de cumpleaños)" maxlength="80">
  <button class="p" id="add">Agregar</button>
  <button id="showbulk">Agregar varias</button>
</div>
<div id="bulkbox" hidden style="margin-top:10px">
  <textarea id="bulk" placeholder="Una actividad por línea:&#10;Escoger clips&#10;Buscar canción&#10;Editar video"></textarea>
  <button class="p" id="addbulk">Agregar todas</button>
</div>
<div id="list"></div>

<h2>Reporte</h2>
<div class="row" style="flex-wrap:wrap">
  <button class="p" id="gen">Generar imagen</button>
  <button id="dl">Descargar PNG</button>
  <button class="g" id="clr">Borrar todo el historial</button>
</div>
<div class="scroll" style="margin-top:12px"><canvas id="cv" width="1000" height="200"></canvas></div>

<section id="hist" hidden>
  <h2>Días anteriores</h2>
  <div class="row" style="flex-wrap:wrap"><select id="hsel"></select><button id="hdl">Descargar PNG</button><button class="danger" id="hdel">Eliminar día</button></div>
  <div class="scroll" style="margin-top:12px"><canvas id="cv2" width="1000" height="200"></canvas></div>
</section>
<dialog id="dlgN">
  <div style="font-weight:600">Empezar un nuevo día</div>
  <p class="sub" style="margin:8px 0 0">El reporte de hoy se guarda en “Días anteriores” y los registros de tiempo se reinician.</p>
  <label style="display:flex;align-items:center;color:var(--tx);font-size:14px;margin-top:14px"><input type="checkbox" id="keep" checked>Conservar las actividades sin finalizar (con tiempo en cero)</label>
  <div class="row" style="margin-top:16px;justify-content:flex-end"><button id="nNo">Cancelar</button><button class="p" id="nOk">Empezar nuevo día</button></div>
</dialog>
<dialog id="dlg">
  <div style="font-weight:600">Editar registro</div>
  <div class="sub" id="eName"></div>
  <label>Inicio<input type="datetime-local" step="1" id="eS"></label>
  <label>Fin (déjalo vacío si sigue en curso)<input type="datetime-local" step="1" id="eE"></label>
  <div class="row" style="margin-top:16px;justify-content:flex-end"><button id="eNo">Cancelar</button><button class="p" id="eOk">Guardar</button></div>
</dialog>
</main>

<script>
const $=s=>document.querySelector(s);
const COLORS=["#5fb8a0","#e8a04a","#7aa2e0","#e07a90","#a98be0","#8fcf5a","#e3c453","#55bfd0"];
const col=a=>COLORS[S.acts.indexOf(a)%COLORS.length];
let S={acts:[],sess:[]};
try{const r=localStorage.getItem("regact");if(r)S=JSON.parse(r)}catch(e){}
S.hist=S.hist||[];
function save(){try{localStorage.setItem("regact",JSON.stringify(S))}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,9);
const fD=ms=>{let s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return h?`${h} h ${m} min`:m?`${m} min ${s} s`:`${s} s`};
const fT=t=>new Date(t).toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
const fDay=t=>new Date(t).toLocaleDateString("es",{day:"numeric",month:"short"});
const fDT=t=>fDay(t)+" "+fT(t);
const dur=s=>(s.e||Date.now())-s.s;
const tot=a=>S.sess.filter(s=>s.a===a.id).reduce((n,s)=>n+dur(s),0);
const run=a=>S.sess.find(s=>s.a===a.id&&!s.e);

function stopAll(){S.sess.forEach(s=>{if(!s.e)s.e=Date.now()})}
function toggle(id){const a=S.acts.find(x=>x.id===id);if(run(a)){stopAll()}else{stopAll();S.sess.push({id:uid(),a:id,s:Date.now(),e:null})}save();render()}
function addAct(){const v=$("#nm").value.trim();if(!v)return;S.acts.push({id:uid(),n:v,c:COLORS[S.acts.length%COLORS.length]});$("#nm").value="";save();render()}
function addBulk(){const ls=$("#bulk").value.split("\n").map(l=>l.replace(/^\s*(?:[-•*]|\d+[.)])\s*/,"").trim()).filter(Boolean);if(!ls.length)return;ls.forEach(n=>S.acts.push({id:uid(),n:n.slice(0,80),c:COLORS[S.acts.length%COLORS.length]}));$("#bulk").value="";$("#bulkbox").hidden=true;save();render()}
function fin(id){const a=S.acts.find(x=>x.id===id);if(!a)return;if(!a.d){S.sess.forEach(s=>{if(s.a===id&&!s.e)s.e=Date.now()});a.d=Date.now()}else delete a.d;save();render()}
function delAct(id){if(!confirm("¿Eliminar la actividad y sus registros?"))return;S.acts=S.acts.filter(a=>a.id!==id);S.sess=S.sess.filter(s=>s.a!==id);save();render()}
function delSes(id){S.sess=S.sess.filter(s=>s.id!==id);save();render()}

function render(){
  const L=$("#list");
  if(!S.acts.length){L.innerHTML='<div class="empty">Agrega tu primera actividad arriba.</div>';return}
  L.innerHTML=[...S.acts].sort((x,y)=>(x.d?1:0)-(y.d?1:0)).map(a=>{
    const r=run(a),ss=S.sess.filter(s=>s.a===a.id).sort((x,y)=>y.s-x.s);
    return `<div class="card" style="--c:${col(a)};${a.d?'opacity:.6':''}">
      <div class="top"><div><div class="name">${a.d?'✓ ':''}${esc(a.n)}</div>
      <div class="sub" data-t="${a.id}">${r?'<span class="live">● Trabajando · </span>':''}${a.d?'Finalizada el '+fDT(a.d)+' · ':''}Total: ${fD(tot(a))} · ${ss.length} sesión(es)</div></div>
      ${a.d?'':`<button class="${r?'stop':'p'}" onclick="toggle('${a.id}')">${r?'Detener':'Iniciar'}</button>`}</div>
      ${ss.length?`<details><summary>Ver registros</summary>${ss.map(s=>`<div class="ses"><span>${fDT(s.s)} → ${s.e?fT(s.e):"en curso"} · ${fD(dur(s))}</span><span style="white-space:nowrap"><button class="g" onclick="editSes('${s.id}')">Editar</button><button class="g" onclick="delSes('${s.id}')">✕</button></span></div>`).join("")}</details>`:""}
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:auto;padding-top:10px"><button onclick="fin('${a.id}')">${a.d?'Reabrir':'Finalizar'}</button><button class="danger" onclick="delAct('${a.id}')">Eliminar</button></div></div>`}).join("");
}
function esc(t){return t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
setInterval(()=>{S.acts.forEach(a=>{const e=document.querySelector(`[data-t="${a.id}"]`);if(e&&run(a))e.innerHTML=`<span class="live">● Trabajando · </span>Total: ${fD(tot(a))} · ${S.sess.filter(s=>s.a===a.id).length} sesión(es)`})},1000);

let CVS="#cv",RT="Reporte de actividades";
function report(h){
  if(!h)return drawReport();
  const A=S.acts,B=S.sess;S.acts=h.acts;S.sess=h.sess;CVS="#cv2";RT="Reporte · "+h.label;
  try{drawReport()}finally{S.acts=A;S.sess=B;CVS="#cv";RT="Reporte de actividades"}
}
function drawReport(){
  const cv=$(CVS),ss=S.sess,acts=S.acts.filter(a=>ss.some(s=>s.a===a.id));
  const W=1000,P=24,LM=200,RM=130,RH=46,top=96,rowH=28,headH=46,gap=16;
  const BG="#222220",TX="#efeee9",MU="#9a988f",LN="#363632";
  const F=(z,b)=>(b?"bold ":"")+z+"px system-ui,sans-serif";
  const y0=top+acts.length*RH+52;
  let H=160;
  if(acts.length){H=y0+34+40;acts.forEach(a=>{H+=headH+ss.filter(s=>s.a===a.id).length*rowH+gap})}
  cv.width=W;cv.height=H;
  const x=cv.getContext("2d");
  const fit=(t,m)=>{while(x.measureText(t).width>m&&t.length>3)t=t.slice(0,-2);return t};
  x.fillStyle=BG;x.fillRect(0,0,W,H);
  x.textAlign="left";x.fillStyle=TX;x.font=F(24,1);x.fillText(RT,P,40);
  if(!acts.length){x.font=F(16);x.fillStyle=MU;x.fillText("Aún no hay sesiones registradas.",P,80);return}
  const t0=Math.min(...ss.map(s=>s.s)),t1=Math.max(...ss.map(s=>s.e||Date.now())),span=Math.max(t1-t0,1000);
  x.font=F(14);x.fillStyle=MU;
  x.fillText(fDT(t0)+"  →  "+fDT(t1)+"   ·   Tiempo total: "+fD(ss.reduce((n,s)=>n+dur(s),0)),P,64);
  // línea de tiempo general
  const cw=W-LM-RM,px=t=>LM+(t-t0)/span*cw;
  for(let i=0;i<=5;i++){
    const t=t0+span*i/5,xx=LM+cw*i/5;
    x.strokeStyle=LN;x.beginPath();x.moveTo(xx,top-6);x.lineTo(xx,top+acts.length*RH);x.stroke();
    x.fillStyle=MU;x.font=F(12);x.textAlign=i==5?"right":i==0?"left":"center";
    x.fillText(span>864e5?fDay(t)+" "+fT(t).slice(0,5):fT(t).slice(0,5),xx,top+acts.length*RH+20);
  }
  x.textAlign="left";
  acts.forEach((a,i)=>{
    const y=top+i*RH;
    x.font=F(14);x.fillStyle=TX;x.fillText(fit(a.n,LM-34),P,y+RH/2+5);
    x.fillStyle=MU;x.textAlign="right";x.fillText(fD(tot(a)),W-16,y+RH/2+5);x.textAlign="left";
    x.fillStyle=col(a);
    ss.filter(s=>s.a===a.id).forEach(s=>{const x1=px(s.s);x.fillRect(x1,y+10,Math.max(px(s.e||Date.now())-x1,3),RH-20)});
  });
  // detalle por actividad
  let y=y0;
  x.fillStyle=TX;x.font=F(18,1);x.fillText("Detalle por actividad",P,y+8);
  y+=34;
  acts.forEach(a=>{
    const list=ss.filter(s=>s.a===a.id).sort((m,n)=>m.s-n.s),h=headH+list.length*rowH;
    const mx=Math.max(...list.map(dur),1);
    x.fillStyle=col(a);x.fillRect(P,y,6,h-6);
    x.font=F(17,1);x.fillStyle=TX;x.fillText(fit(a.n,560),P+18,y+20);
    x.font=F(14);x.fillStyle=col(a);x.textAlign="right";
    x.fillText("Total "+fD(tot(a))+"  ·  "+list.length+(list.length==1?" sesión":" sesiones"),W-P,y+20);
    x.textAlign="left";
    list.forEach((s,i)=>{
      const yy=y+headH+i*rowH;
      x.fillStyle=MU;x.font=F(13);x.fillText("Sesión "+(i+1),P+18,yy);
      x.fillStyle=TX;x.font=F(14);
      const fin=s.e?(fDay(s.s)===fDay(s.e)?fT(s.e):fDT(s.e)):"en curso";
      x.fillText(fDT(s.s)+"  →  "+fin,P+90,yy);
      x.fillStyle=LN;x.fillRect(600,yy-11,230,10);
      x.fillStyle=col(a);x.fillRect(600,yy-11,Math.max(230*dur(s)/mx,3),10);
      x.fillStyle=TX;x.textAlign="right";x.fillText(fD(dur(s)),W-P,yy);x.textAlign="left";
    });
    y+=h+gap;
    x.strokeStyle=LN;x.beginPath();x.moveTo(P,y-gap/2-3);x.lineTo(W-P,y-gap/2-3);x.stroke();
  });
  x.fillStyle=MU;x.font=F(12);x.fillText("Cada barra de la línea de tiempo es una sesión de trabajo.",P,H-14);
}
const pad=n=>String(n).padStart(2,"0");
const toL=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};
let editId=null;
function editSes(id){const s=S.sess.find(x=>x.id===id);if(!s)return;editId=id;const a=S.acts.find(x=>x.id===s.a);$("#eName").textContent=a?a.n:"";$("#eS").value=toL(s.s);$("#eE").value=s.e?toL(s.e):"";$("#dlg").showModal()}
$("#eNo").onclick=()=>$("#dlg").close();
$("#eOk").onclick=()=>{
  const s=S.sess.find(x=>x.id===editId);if(!s)return;
  const a=new Date($("#eS").value).getTime(),ev=$("#eE").value,b=ev?new Date(ev).getTime():null;
  if(isNaN(a)){alert("La hora de inicio no es válida.");return}
  if(b!==null&&(isNaN(b)||b<=a)){alert("La hora de fin debe ser posterior al inicio.");return}
  if(b===null&&S.sess.some(x=>!x.e&&x.id!==s.id)){alert("Ya hay otra sesión en curso. Ponle hora de fin a este registro.");return}
  s.s=a;s.e=b;save();$("#dlg").close();render();report()};
let hSel=null;
function renderHist(){
  $("#hist").hidden=!S.hist.length;
  if(!S.hist.length){hSel=null;return}
  if(!S.hist.some(h=>h.id===hSel))hSel=S.hist[S.hist.length-1].id;
  $("#hsel").innerHTML=[...S.hist].reverse().map(h=>`<option value="${h.id}"${h.id===hSel?" selected":""}>${esc(h.label)} · ${fD(h.sess.reduce((n,s)=>n+((s.e||Date.now())-s.s),0))}</option>`).join("");
  drawH();
}
function drawH(){const h=S.hist.find(x=>x.id===hSel);if(h)report(h)}
$("#hsel").onchange=e=>{hSel=e.target.value;drawH()};
$("#hdl").onclick=()=>{const h=S.hist.find(x=>x.id===hSel);if(!h)return;drawH();const l=document.createElement("a");l.download="reporte-"+h.label.replace(/[^a-zA-Z0-9áéíóúñ]+/g,"-")+".png";l.href=$("#cv2").toDataURL("image/png");l.click()};
$("#hdel").onclick=()=>{if(!confirm("¿Eliminar este día del historial?"))return;S.hist=S.hist.filter(h=>h.id!==hSel);hSel=null;save();renderHist()};
$("#newday").onclick=()=>{$("#keep").checked=true;$("#dlgN").showModal()};
$("#nNo").onclick=()=>$("#dlgN").close();
$("#nOk").onclick=()=>{
  stopAll();
  if(S.sess.length){
    S.hist.push({id:uid(),label:new Date(Math.min(...S.sess.map(s=>s.s))).toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long",year:"numeric"}),acts:JSON.parse(JSON.stringify(S.acts)),sess:JSON.parse(JSON.stringify(S.sess))});
    hSel=null;
  }
  S.acts=$("#keep").checked?S.acts.filter(a=>!a.d).map(a=>({id:a.id,n:a.n})):[];
  S.sess=[];save();$("#dlgN").close();render();report();renderHist();
  $("#bulkbox").hidden=false;$("#bulk").focus();
};
$("#gen").onclick=()=>report();
$("#dl").onclick=()=>{report();const l=document.createElement("a");l.download="reporte-actividades.png";l.href=$("#cv").toDataURL("image/png");l.click()};
$("#clr").onclick=()=>{if(confirm("¿Borrar todas las sesiones registradas? Las actividades se mantienen.")){S.sess=[];save();render();report()}};
$("#add").onclick=addAct;
$("#addbulk").onclick=addBulk;
$("#showbulk").onclick=()=>{const b=$("#bulkbox");b.hidden=!b.hidden;if(!b.hidden)$("#bulk").focus()};
$("#nm").addEventListener("keydown",e=>{if(e.key==="Enter")addAct()});
render();report();renderHist();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
